<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopNova</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="logo">ShopNova</div>
        <input type="text" placeholder="Search products..." class="search-bar">
        <div class="cart" id="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</div>
    </header>

    <section class="banner">
        <h1>Big Sale! Up to 50% Off!</h1>
    </section>

    <section class="products" id="products">
        <!-- Products will be added here by JavaScript -->
    </section>

    <!-- 🛒 Cart Modal -->
    <div id="cart-modal" class="modal hidden">
        <div class="cart-content">
            <span id="close-cart-btn" class="close-btn">&times;</span>
            <h2>Your Cart</h2>
            <div id="cart-items"></div>
            <button id="checkout-btn">Checkout</button>
        </div>
    </div>

    <footer>
        <p>© 2025 ShopNova. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tek Ürün Mağazası</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">TekÜrün<span>Shop</span></div>
        <button class="cart-btn">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count">0</span>
        </button>
    </nav>

    <div class="product-container">
        <div class="product-card">
            <img src="https://via.placeholder.com/200x200?text=Ürün+Resmi" alt="Ürün">
            <h3>Premium Akıllı Saat</h3>
            <p class="price">₺1,299.99</p>
            <button class="add-to-cart">Sepete Ekle</button>
        </div>
    </div>

    <!-- SEPET MODAL -->
    <div class="cart-modal">
        <div class="cart-header">
            <h3>Sepetiniz</h3>
            <button class="close-cart">&times;</button>
        </div>
        <div class="cart-items">
            <!-- Sepet öğeleri buraya gelecek -->
        </div>
        <div class="cart-total">
            <p>Toplam: <span>₺0.00</span></p>
            <button class="checkout-btn">Ödeme Yap</button>
        </div>
    </div>

    <!-- ÖDEME MODAL -->
    <div class="payment-modal">
        <div class="payment-content">
            <button class="close-payment">&times;</button>
            <h2>Ödeme Bilgileri</h2>
            <form id="payment-form">
                <div class="form-group">
                    <label>Kart Numarası</label>
                    <input type="text" placeholder="1234 5678 9012 3456" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Son Kullanma</label>
                        <input type="text" placeholder="MM/YY" required>
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="text" placeholder="123" required>
                    </div>
                </div>
                <button type="submit" class="submit-payment">Ödemeyi Tamamla</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

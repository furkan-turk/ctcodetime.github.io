<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Blog Template</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <div class="profile-pic">
            <img src="your-photo.jpg" alt="Your Photo" />
        </div>
        <h1><!-- Blog Title -->Your Blog Name</h1>
        <p class="subtitle"><!-- Blog Subtitle -->Share your thoughts with the world</p>
    </header>

    <main>
        <section class="about">
            <h2>About Me</h2>
            <p><!-- About Section -->Introduce yourself here. Share your passions, profession, or story.</p>
        </section>

        <section class="posts">
            <h2>Recent Posts</h2>

            <article>
                <h3><!-- Post Title -->First Blog Post</h3>
                <p><!-- Post Content -->Write your post content here. You can talk about your experiences or ideas.</p>
            </article>

            <!-- You can duplicate <article> to add more posts -->
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Your Name</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
